wer":"C","basis":"art. 222 § 2 k.c."},{"n":40,"q":"Zgodnie z Kodeksem cywilnym, samoistny posiadacz gruntu, który wzniósł na powierzchni lub pod powierzchnią gruntu budynek lub inne urządzenie o wartości przenoszącej znacznie wartość zajętej na ten cel działki:","options":["może żądać, aby właściciel przeniósł na niego własność zajętej działki za odpowiednim wynagrodzeniem, jeżeli samoistny posiadacz był w dobrej wierze,","nigdy nie może żądać, aby właściciel przeniósł na niego własność zajętej działki,","może żądać, aby właściciel przeniósł na niego własność zajętej działki nawet bez wynagrodzenia, również wówczas, gdy samoistny posiadacz był w złej wierze."],"year":2022,"source_question":"2022/40","answer":"A","basis":"art. 231 § 1 k.c."},{"n":41,"q":"Zgodnie z Kodeksem cywilnym, roszczenie właściciela przeciwko użytkownikowi o  naprawienie szkody z powodu pogorszenia rzeczy albo o zwrot nakładów na rzecz przedawniają się z upływem:","options":["roku od dnia zwrotu rzeczy,","dwóch lat, bez względu na to, czy rzecz została zwrócona,","trzech lat od dnia, w którym rzecz miała zostać zwrócona."],"year":2022,"source_question":"2022/41","answer":"A","basis":"art. 263 k.c."},{"n":42,"q":"Zgodnie z Kodeksem cywilnym, jeżeli z powodu nadzwyczajnej zmiany stosunków spełnienie świadczenia byłoby połączone z nadmiernymi trudnościami albo groziłoby jednej ze stron rażącą stratą, czego strony nie przewidywały przy zawarciu umowy, sąd może po rozważeniu interesów stron, zgodnie z zasadami współżycia społecznego:","options":["oznaczyć sposób wykonania zobowiązania, wysokość świadczenia, nie może jednak orzec o rozwiązaniu umowy,","oznaczyć sposób wykonania zobowiązania, wysokość świadczenia lub nawet orzec o rozwiązaniu umowy,","oznaczyć sposób wykonania zobowiązania, wysokość świadczenia lub nawet orzec o rozwiązaniu umowy, tylko wtedy, gdy z takim żądaniem wystąpi konsument przeciwko przedsiębiorcy."],"year":2022,"source_question":"2022/42","answer":"B","basis":"art. 3571 k.c. ource_question":"2022/45","answer":"A","basis":"art. 387 § 2 k.c."},{"n":46,"q":"Zgodnie z Kodeksem cywilnym, jeżeli ten, kto bez podstawy prawnej uzyskał korzyść majątkową kosztem innej osoby, rozporządził korzyścią na rzecz osoby trzeciej (a w chwili wyzbycia się korzyści nie powinien był liczyć się z obowiązkiem zwrotu), obowiązek wydania korzyści:","options":["zawsze przechodzi na tę osobę trzecią,","przechodzi na tę osobę trzecią, jeżeli to rozporządzenie było bezpłatne,","przechodzi na tę osobę trzecią, nawet jeżeli to rozporządzenie było odpłatne."],"year":2022,"source_question":"2022/46","answer":"B","basis":"art. 407 w zw. z art. 409 k.c."},{"n":47,"q":"Zgodnie z Kodeksem cywilnym, kto (nie będąc osobą, na której ciąży szczególny obowiązek chronienia dobra, nawet z narażeniem na osobiste niebezpieczeństwo) zniszczył lub uszkodził cudzą rzecz albo zabił lub zranił cudze zwierzę w celu odwrócenia od siebie lub od innych niebezpieczeństwa grożącego bezpośrednio od tej rzeczy lub zwierzęcia, ten nie jest odpowiedzialny za wynikłą stąd szkodę:","options":["nawet wtedy, gdy niebezpieczeństwo sam wywołał, a niebezpieczeństwu nie można było inaczej zapobiec i jeżeli ratowane dobro jest przynajmniej tak samo ważne, jak dobro naruszone,","jeżeli niebezpieczeństwa sam nie wywołał, nawet jeżeli niebezpieczeństwu można było inaczej zapobiec, o ile ratowane dobro jest przynajmniej tak samo ważne, jak dobro naruszone,","jeżeli niebezpieczeństwa sam nie wywołał, a niebezpieczeństwu nie można było inaczej zapobiec i jeżeli ratowane dobro jest oczywiście ważniejsze aniżeli dobro naruszone."],"year":2022,"source_question":"2022/47","answer":"C","basis":"art. 424 k.c."},{"n":48,"q":"Zgodnie z Kodeksem cywilnym, przedawnienie roszczeń osoby małoletniej o naprawienie szkody na osobie wyrządzonej czynem niedozwolonym nie może skończyć się wcześniej niż z upływem:","options":["lat dwóch od uzyskania przez nią pełnoletności,","lat trzech od dnia, w którym przedstawiciel ustawowy te graniczenia wolności, przyjmując że jeden miesiąc pozbawienia wolności równa się 60 stawkom dziennym grzywny albo 2 miesiącom ograniczenia wolności,","zamienia się na karę ograniczenia wolno ści, przyjmując że jeden miesiąc pozbawienia wolności równa się jednemu miesiącowi ograniczenia wolności."],"year":2023,"source_question":"2023/1","answer":"B","basis":"art. 4 § 3 k.k."},{"n":2,"q":"Zgodnie z Kodeksem karnym, jeżeli okoliczności sprawy oraz stopień rozwoju sprawcy, jego właściwości i warunki osobiste za tym przemawiają, a w szczególności, jeżeli poprzednio stosowane środki wychowawcze lub poprawcze okazały się bezskuteczne, nieletni może odpowiadać na zasadach określonych w tym kodeksie w przypadku dopuszczenia się po ukończeniu 15 lat czynu zabronionego polegającego na:","options":["nieumyślnym spowodowaniu śmierci człowieka,","spowodowaniu w wyniku naruszenia, chociażby nieumyślnie, zasad bezpieczeństwa w ruchu lądowym, wypadku komunikacyjnego, następstwem którego jest śmierć innej osoby,","umyślnym sprowadzeniu katastrofy w ruchu lądowym, wodnym lub powietrznym zagrażającej życiu lub zdrowiu wielu osób albo mieniu w wielkich rozmiarach."],"year":2023,"source_question":"2023/2","answer":"C","basis":"art. 10 § 2 k.k. w zw. z art. 173 § 1 k.k."},{"n":3,"q":"Zgodnie z Kodeksem karnym, kto w celu skierowania przeciwko innej osobie postępowania karnego nakłania ją do popełnienia czynu zabronionego, odpowiada jak za:","options":["podżeganie,","sprawstwo,","pomocnictwo. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 3"],"year":2023,"source_question":"2023/3","answer":"A","basis":"art. 24 k.k."},{"n":4,"q":"Zgodnie z Kodeksem karnym, nie popełnia przestępstwa, kto:","options":["przekracza granice obrony koniecznej pod wpływem strachu lub wzburzenia usprawiedliwionych okolicznościami zamachu,","przekracza granice obrony koniecznej, odpierając zamach polegający na wdarciu się do mieszkania, lokalu, domu albo na przylegający do nich ogrodzony teren lub odpierając zamach poprzedzony wdarciem się do tych miejsc, chyba że przekroczenie granic obrony koniecznej było rażące,","działa w celu uchylenia bezpośredniego niebezpieczeństwa grożącego jakiemukolwiek dobru chronionemu prawem, jeżeli niebezpieczeństwa nie można inaczej uniknąć, a dobro poświęcone przedstawia wartość niższą od dobra ratowanego."],"year":2023,"source_question":"2023/4","answer":"C","basis":"art. 26 § 1 k.k."},{"n":5,"q":"Zgodnie z Kodeksem karnym, w razie przekroczenia przez sprawcę granic stanu wyższej konieczności, sąd:","options":["odstępuje od wymierzenia kary,","stosuje nadzwyczajne złagodzenie kary,","może zast osować nadzwyczajne złagodzenie kary, a nawet odstąpić od jej wymierzenia."],"year":2023,"source_question":"2023/5","answer":"C","basis":"art. 26 § 3 k.k."},{"n":6,"q":"Zgodnie z Kodeksem karnym, środkiem karnym między innymi jest:","options":["świadczenie pieniężne,","nawiązka,","przepadek."],"year":2023,"source_question":"2023/6","answer":"A","basis":"art. 39 pkt 7 k.k."},{"n":7,"q":"Zgodnie z Kodeksem karnym, środek karny w postaci zakazu wstępu na imprezę masową obejmuje wszelkie imprezy masowe:","options":["tylko na terytorium Rzeczypospolitej Polskiej, bez względu na charakter imprezy masowej,","na terytorium Rzeczypospolitej Polskiej oraz wszelkie zawody sportowe z udziałem polskiej kadry narodowej poza terytorium Rzeczypospolitej Polskiej,","na terytorium Rzeczypospolitej Polskiej oraz mecze piłki nożnej rozgrywane przez polską kadrę narodową lub polski klub sportowy poza terytorium Rzeczypospolitej Polskiej. 4 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"],"year":2023,"source_question":"2023/7","answer":"C","basis":"art. 41b § 2 k.k."},{"n":8,"q":"Zgodnie z Kodeksem karnym, okres, na który orzeczono środek karny w postaci pozbawienia praw publicznych za dane przestępstwo, nie biegnie w czasie:","options":["odbywania kary pozbawienia wolności za to przestępstwo,","odbywania kary pozbawienia wolności za inne przestępstwo,","wykonywania innego środka karnego."],"year":2023,"source_question":"2023/8","answer":"A","basis":"art. 43 § 2b k.k."},{"n":9,"q":"Zgodnie z Kodeksem karnym, w razie skazania na karę ograniczenia wolności sprawcy, wobec którego nie orzeczono środka karnego, przepadku lub środka kompensacyjnego, jak również środka zabezpieczającego, zatarcie skazania następuje z mocy prawa z upływem:","options":["roku od wykonania lub darowania kary albo od przedawnienia jej wykonania,","2 lat od wykonania lub darowania kary albo od przedawnienia jej wykonania,","3 lat od wykonania lub darowania kary albo od przedawnienia jej wykonania."],"year":2023,"source_question":"2023/9","answer":"C","basis":"art. 107 § 4 i 6 k.k."},{"n":10,"q":"Zgodnie z Kodeksem karnym, przygotowanie jest karalne tylko wtedy, gdy ustawa tak stanowi; karalne jest przygotowanie do przestępstwa:","options":["zgwałcenia ze szczególnym okrucieństwem,","umyślnego sprowadzenia katastrofy w ruchu lądowym, wodnym lub powietrznym zagrażającej życiu lub zdrowiu wielu osób albo mieniu w wielkich rozmiarach,","rozboju z użyciem broni palnej, noża lub innego podobnie niebezpiecznego przedmiotu lub środka obezwładniającego."],"year":2023,"source_question":"2023/10","answer":"B","basis":"art. 175 w zw. z art. 173 § 1 w zw. z art. 16 § 2 k.k."},{"n":11,"q":"Zgodnie z Kodeksem karnym, kto znieważa funkcjonariusza publicznego lub osobę do pomocy mu przybraną, podczas i w związku z pełnieniem obowiązków służbowych podlega grzywnie, karze ograniczenia wolności albo pozbawienia wolności do roku; jeżeli czyn ten wywołało niewłaściwe zachowanie się funkcjonariusza lub osoby do pomocy mu przybranej, sąd:","options":["stosuje nadzwyczajne złagodzenie kary,","odstępuje od wymierzenia kary,","może zastosować nadzwy czajne złagodzenie kary, a nawet odstąpić od jej wymierzenia. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 5"],"year":2023,"source_question":"2023/11","answer":"C","basis":"art. 222 § 2 w zw. z art. 226 § 2 k.k."},{"n":12,"q":"Zgodnie z Kodeksem karnym, kto , w celu uzyskania odszkodowania z tytułu umowy ubezpieczenia, powoduje zdarzenie będące podstawą do wypłaty takiego odszkodowania, a przed wszcz ęciem postępowania karnego dobrowolnie zapobiegł wypłacie odszkodowania:","options":["nie popełnia przestępstwa,","korzysta z dobrodziejstwa nadzwyczajnego złagodzenia kary,","nie podlega karze."],"year":2023,"source_question":"2023/12","answer":"C","basis":"art. 298 k.k."},{"n":13,"q":"Zgodnie z Kodeksem postępowania karnego, jeżeli orzeczenie wobec oskar żonego kary byłoby oczywiście niecelowe ze względu na rodzaj i wysokość kary prawomocnie orzeczonej za inne przestępstwo, a interes pokrzywdzonego temu się nie sprzeciwia, można umorzyć postępowanie w sprawie o występek zagrożony karą pozbawienia wolności do lat:","options":["10,","8,","5."],"year":2023,"source_question":"2023/13","answer":"C","basis":"art. 11 § 1 k.p.k."},{"n":14,"q":"Zgodnie z Kodeksem postępowania karnego, nie wszczyna się postępowania, a wszczęte umarza, gdy między innymi:","options":["zachodzi długotrwała przeszkoda uniemożliwiająca prowadzenie postępowania, a w szczególności jeżeli nie można ująć oskarżonego,","ten sam czyn stanowi zarówno przestępstwo, jak i wykroczenie,","brak skargi uprawnionego oskarżyciela."],"year":2023,"source_question":"2023/14","answer":"C","basis":"art. 17 § 1 pkt 9 k.p.k."},{"n":15,"q":"Zgodnie z Kodeksem postępowania karnego, jeżeli sąd wojskowy przekaże sprawę sądowi powszechnemu lub nie przyjmie sp rawy przekazanej mu przez sąd powszechny, sprawę rozpoznaje:","options":["sąd powszechny,","sąd powszechny, chyba że sąd wyższego rzędu nad sądem powszechnym, rozstrzygając spór o właściwość, przekaże sprawę do rozpoznania sądowi wojskowemu,","sąd powszechny, chyba że Sąd Najwyższy, rozstrzygając spór o właściwość, przekaże sprawę do rozpoznania sądowi wojskowemu. 6 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"]," zielni co najmniej 14 dni przed terminem posiedzenia walnego zgromadzenia."],"year":2023,"source_question":"2023/52","answer":"B","basis":"art. 8 3 ust. 6 ustawy z dnia 15 grudnia 2000 r. o spółdzielniach mieszkaniowych"},{"n":53,"q":"Zgodnie z ustawą – Prawo spółdzielcze, liczba osób fizycznych będących założycielami spółdzielni produkcji rolnej nie może być mniejsza od:","options":["dziesięciu,","siedmiu,","pięciu."],"year":2023,"source_question":"2023/53","answer":"C","basis":"art. 6 § 2 ustawy z dnia 16 września 1982 r. – Prawo spółdzielcze"},{"n":54,"q":"Zgodnie z ustawą – Prawo spółdzielcze, członek spółdzielni (niebędącej spółdzielnią mieszkaniową) może wnioskować o udostępnienie do wglądu umów zawartych przez tę spółdzielnię z osobami trzecimi; w takim przypadku spółdzielnia:","options":["bezwarunkowo udostępnia członkowi do wglądu umowy zawierane z osobami trzecimi,","może odmówić członkowi wglądu do umów zawieranych z osobami trzecimi, jeżeli naruszałoby to prawa tych osób lub je żeli istnieje uzasadniona obawa, że członek spółdzielni wykorzysta pozyskane informacje w celach sprzecznych z interesem spółdzielni i przez to wyrządzi spółdzielni znaczną szkodę,","udostępnia członkowi do wglądu umowy zawarte z osobami trzecimi wyłącznie na podstawie zgody udzielonej przez radę nadzorczą spółdzielni, wyrażonej w formie uchwały. 16 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"],"year":2023,"source_question":"2023/54","answer":"B","basis":"art. 18 § 2 pkt 3 i § 3 ustawy z dnia 16 września 1982 r. – Prawo spółdzielcze"},{"n":55,"q":"Zgodnie z ustawą o ochronie praw lokatorów, mieszkaniowym zasobie gminy i o zmianie Kodeksu cywilnego, osoby uprawnione do lokalu zamiennego, jeżeli sąd orzekł o wstrzymaniu wykonania opróżnienia lokalu do czasu dostarczenia im lokalu zamiennego, uiszczają odszkodowanie w wysokości:","options":["czynszu albo innych opłat za używanie lokalu, jakie byłyby obowiązane opłacać, gdyby stosunek prawny (dotyczący dotychczas zajmowanego lokalu) nie wygasł,","podwójnego czynszu albo innych opłat za używanie lokalu, jakie były by obowiązane opłacać, gdyby lokal ten wchodził w skład mieszkaniowego zasobu gminy, na podstawie umowy najmu lokalu socjalnego,","potrójnego czynszu, jaki właściciel mógłby otrzymać z tytułu najmu lokalu."],"year":2023,"source_question":"2023/55","answer":"A","basis":"art. 18 ust. 3 ustawy z dnia 21 czerwca 2001 r. o ochronie praw lokatorów, mieszkaniowym zasobie gminy i o zmianie Kodeksu cywilnego"},{"n":56,"q":"Zgodnie z ustawą o własności lokali, jeżeli liczba lokali wyodrębnionych i lokali niewyodrębnionych, należących nadal do dotychczasowego właściciela, jest większa niż trzy, a właściciele lokali w umowie o ustanowieniu odrębnej własności lokali, w umowie za wartej później w formie aktu notarialnego lub w uchwale zaprotokołowanej przez notariusza nie określą sposobu zarządu, połączenie dwóch lokali stanowiących odrębne nieruchomości w jedną nieruchomość:","options":["wymaga zgody zarządu wyrażonej na piśmie pod rygorem nieważności,","wymaga zgody właścicieli lokali wyrażonej w uchwale, a w razie odmowy zainteresowany właściciel lokalu może żądać rozstrzygnięcia przez sąd,","nie wymaga zgody zarządu ani zgody właścicieli lokali wyrażonej w uchwale."],"year":2023,"source_question":"2023/56","answer":"B","basis":"art. 22 ust. 4 w zw. z art. 18 ust. 3 i art. 19 ustawy z dnia 24 czerwca 1994 r. o własności lokali"},{"n":57,"q":"Zgodnie z ustawą o własności lokali, w razie zaskarżenia do sądu uchwały właścicieli lokali, zaskarżona uchwała:","options":["traci moc z chwilą wniesienia pozwu,","podlega wykonaniu, chyba że sąd wstrzyma jej wykonanie do czasu zakończenia sprawy,","nie podlega wykonaniu od chwili wniesienia pozwu, chyba że sąd stwierdzi jej wykonalność. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 17"],"year":2023,"source_question":"2023/57","answer":"B","basis":"art. 25 ust. 2 ustawy z dnia 24 czerwca 1994 r. o własności lokali"},{"n":58,"q":"Zgodnie z ustawą o gospodarce nieruchomościami, nieruchomością gruntową w rozumieniu tej ustawy jest:","options":["grunt wraz z częściami składowymi, w tym budynkami posadowi onymi na tym gruncie, nawet jeżeli stanowią odrębny przedmiot własności,","grunt z wyłączeniem wszystkich jego części składowych i wszystkich posadowionych na nim naniesień, w tym budynków i budowli,","grunt wraz z częściami składowymi, z wyłączeniem budynków i lokali, jeżeli stanowią odrębny przedmiot własności."],"year":2023,"source_question":"2023/58","answer":"C","basis":"art. 4 pkt 1 ustawy z dnia 21 sierpnia 1997 r. o gospodarce nieruchomościami"},{"n":59,"q":"Zgodnie z ustawą o gospodarce nieruchomościami, opłata ustalo na w związku ze wzrostem wartości nieruchomości spowodowanym budową urządzeń infrastruktury technicznej z udziałem środków Skarbu Pańs twa, jednostek samorządu terytorialnego, środków pochodzących z budżetu Unii Europejskiej lub ze źródeł zagranicznych niepodlegających zwrotowi, albo opłata ustalona w związku ze scaleniem i podziałem nieruchomości, a także podziałem nieruchomości, to:","options":["opłata za wieczyste użytkowanie,","opłata adiacencka,","podatek od nieruchomości."],"year":2023,"source_question":"2023/59","answer":"B","basis":"art. 4 pkt 11 ustawy z dnia 21 sierpnia 1997 r. o gospodarce nieruchomościami"},{"n":60,"q":"Zgodnie z Kodeksem postępowania cywilnego, w razie uzasadnionej potrzeby sąd może udzielić stronie niezbędnych pouczeń co do czynności procesowych:","options":["tylko wówczas, gdy przyznano jej pełnomocnika z urzędu,","tylko wówczas, gdy jest ona reprezentowana przez adwokata, radcę prawnego, rzecznika patentowego lub radcę Prokuratorii Generalnej Rzeczypospoli tej Polskiej,","jeżeli występuje ona w sprawie bez adwokata, radcy prawnego, rzecznika patentowego lub radcy Prokuratorii Generalnej Rzeczypospolitej Polskiej. 18 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"],"year":2023,"source_question":"2023/60","answer":"C","basis":"art. 5 k.p.c."},{"n":61,"q":"Zgodnie z Kodeksem postępowania cywilnego , do właściwości sądów okręgowych jako sądów pierwszej instancji należą między innymi:","options":["sprawy o prawa niemajątkowe i łącznie z nimi dochodzone roszczenia majątkowe oprócz spraw o ustalenie lub zaprzeczenie pochodzenia dziecka, o ustalenie bezskuteczności uznania ojcostwa oraz o rozwiązanie przysposobienia,","wszystkie sprawy rozpoznawane w postępowaniu nieprocesowym,","wszystkie sprawy o prawa majątkowe, w których wartość przedmiotu sporu przewyższa siedemdziesiąt pięć tysięcy złotych."],"year":2023,"source_question":"2023/61","answer":"A","basis":"art. 17 pkt 1 k.p.c."},{"n":62,"q":"Zgodnie z Kodeksem postępowania cywilnego, w zakresie czynności przewodniczącego asystent sędziego może wydawać:","options":["wszystkie zarządzenia,","tylko zarządzenia o zwrocie pisma procesowego, w tym pozwu,","zarządzenia, z wyjątkiem zarządzenia o zwrocie pisma procesowego, w tym pozwu."],"year":2023,"source_question":"2023/62","answer":"C","basis":"art. 472 § 1 k.p.c."},{"n":63,"q":"Zgodnie z Kodeksem postępowania cywilnego, kto występuje z roszczeniem o rzecz lub prawo, o które sprawa (niepodlegająca rozpoznaniu w postępowaniu uproszczonym) toczy się pomiędzy innymi osobami , może aż do zamknięcia rozprawy w pierwszej instancji wytoczyć powództ wo o tę rzecz lub prawo przeciwko obu stronom przed sąd, w którym toczy się sprawa; jest to:","options":["interwencja uboczna,","interwencja główna,","przypozwanie."],"year":2023,"source_question":"2023/63","answer":"B","basis":"art. 75 k.p.c."},{"n":64,"q":"Zgodnie z Kodeksem postępowania cywilnego, adwokat lub radca prawny, który wypowiedział pełnomocnictwo procesowe, obowiązany jest działać za stronę:","options":["do czasu ustanowienia przez sąd lub stronę nowego pełnomocnika,","do czasu zakończenia postępowania w danej instancji,","jeszcze przez dwa tygodnie, chyba że mocodawca zwolni go od tego obowiązku. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 19"],"year":2023,"source_question":"2023/64","answer":"C","basis":"art. 94 § 2 k.p.c."},{"n":65,"q":"Zgodnie z Kodeksem postępowania cywilnego, udział prokuratora w sprawie (w której zgłosił on swój udział w toczącym się postępowaniu):","options":["nie uzasadnia zasądzenia zwrotu kosztów procesu na rzecz Skarbu Państwa ani od Skarbu Państwa,","uzasadnia zasądzenie zwrotu kosztów procesu na rzecz Skarbu Państwa tylko w szczególnie uzasadnionych wypadkach, gdy uzasadnia to nakład pracy prokuratora; stosuje się odpowiednio przepisy o wynagrodzeniu adwokata i radcy prawnego, przy czym stawki są pomniejszone o połowę,","uzasadnia zasądzenie zwrotu kosztów procesu na rzecz Skarbu Państwa; stosuje się odpowiednio przepisy o wynagrodzeniu adwokata i radcy prawnego."],"year":2023,"source_question":"2023/65","answer":"A","basis":"art. 106 w zw. z art. 7 k.p.c."},{"n":66,"q":"Zgodnie z Kodeksem postępowania cywilnego, sąd cofnie ustanowienie adwokata lub radcy prawnego, j eżeli okaże się, że okoliczności, na których podstawie je przyznano, nie istniały lub przestały istnieć; stronę, która uzyskała ustanowienie adwokata lub radcy prawnego na podstawie podania świadomie nieprawdziwych okoliczności, sąd:","options":["obciąży wyłącznie obowiązkiem uiszczenia wynagrodzenia adwokata lub radcy prawnego,","skaże na grzywnę, niezależnie od jej obowiązku uiszczenia wynagrodzenia adwokata lub radcy prawnego,","obciąży obowiązkiem uiszczenia wynagrodzenia adwokata lub radcy prawne go oraz obowiązkiem uiszczenia równowartości wynagrodzenia adwokata lub radcy prawnego na rzecz właściwego organu samorządu adwokackiego lub radcowskiego."],"year":2023,"source_question":"2023/66","answer":"B","basis":"art. 120 § 4 k.p.c."},{"n":67,"q":"Zgodnie z Kodeksem postępowania cywilnego, sąd dokonuje doręczeń między innymi przez osoby zatru dnione w sądzie; w dni ustawowo uznane za wolne od pracy, jako też w porze nocnej:","options":["nigdy nie dokonuje się doręczeń przez osoby zatrudnione w sądzie,","doręczać można przez osoby zatrudnione w sądzie tylko w wyjątkowych wypadkach za uprzednim zarządzeniem prezesa sądu,","doręczać można przez osoby zatrudnione w sądzie tylko w wyjątkowych wypadkach za uprzednim zarządzeniem przewodniczącego posiedzenia. 20 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"],"year":2023,"source_question":"2023/67","answer":"B","basis":"art. 134 § 1 w zw. z art. 131 § 1 k.p.c. 4"},{"n":68,"q":"Zgodnie z Kodeksem postępowania cywilnego, jeżeli przedmiot oględzin jest w posiadaniu osoby trzeciej, a oględziny mają być dokonane w miejscu, gdzie przedmiot znajduje się, osoba ta powinna być wezwana na termin oględzin i obowiązana jest ułatwić dostęp do przedmiotu; osobę trzecią, która bez uzasadnionych przyczyn nie zastosowała się do zarządzeń w przedmiocie oględzin, sąd:","options":["skaże na grzywnę,","skaże na karę aresztu do 7 dni,","zobowiąże do pokrycia kosztów przeprowadzenia oględzin przez właściwego miejscowo komornika."],"year":2023,"source_question":"2023/68","answer":"A","basis":"art. 296 k.p.c."},{"n":69,"q":"Zgodnie z Kodeksem postępowania cywilnego, wyrok zaoczny doręcza się:","options":["stronom z urzędu,","stronom tylko na wniosek,","powodowi tylko na wniosek, a pozwanemu z urzędu."],"year":2023,"source_question":"2023/69","answer":"A","basis":"art. 343 § 1 k.p.c."},{"n":70,"q":"Zgodnie z Kodeksem postępowania cywilnego, w sprawach o prawa majątkowe sąd drugiej instancji nie może zmienić wyroku na niekorzyść strony wnoszącej apelację:","options":["w żadnym przypadku,","chyba że strona przeciwna również wniosła apelację,","chyba że przemawiają za tym zasady współżycia społecznego."],"year":2023,"source_question":"2023/70","answer":"B","basis":"art. 384 w zw. z art. 17 pkt 4 k.p.c."},{"n":71,"q":"Zgodnie z ustawą o kosztach sądowych w sprawach cywilnych, jeżeli strona ma obowiązek uiszczenia kosztów sądowych, od wniosku o udzielenie zabezpieczenia roszczenia pieniężnego złożonego przed wniesieniem pisma wszczynającego postępowanie:","options":["nie pobiera się opłaty,","pobiera się czwartą część opłaty należnej od pozwu o to roszczenie,","pobiera się pełną opłatę należną od pozwu o to roszczenie. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 21"],"year":2023,"source_question":"2023/71","answer":"B","basis":"art. 69 ust. 1 ustawy z dnia 28 lipca 2005 r. o kosztac h sądowych w sprawach cywilnych"},{"n":72,"q":"Zgodnie z ustawą o kosztach sądowych w sprawach cywilnych, sąd z urzędu zwraca stronie całą uiszczoną opłatę sądową między innymi od:","options":["skargi kasacyjnej lub skargi o stwierdzenie niezgodności z prawem prawomocnego orzeczenia nieprzyjętej do rozpoznania przez Sąd Najwyższy,","skargi o stwierdzenie niezgodności z prawem prawomocnego orzeczenia w razie jej uwzględnienia,","pisma wszczynającego postępowanie w drugiej instancji, w której sprawa zakończyła się zawarciem ugody sądowej."],"year":2023,"source_question":"2023/72","answer":"B","basis":"art. 79 ust. 1 pkt 1 lit. g ustawy z dnia 28 lipca 2005 r. o kosztach sądowych w sprawach cywilnych"},{"n":73,"q":"Zgodnie z ustawą o kosztach sądowych w sprawach cywilnych, roszczenie strony o zwrot opłaty sądowej:","options":["przedawnia się z upływem trzech lat, licząc od dnia powstania tego roszczenia,","przedawnia się z upływem pięciu lat, licząc od dnia uiszczenia opłaty,","nie przedawnia się."],"year":2023,"source_question":"2023/73","answer":"A","basis":"art. 81 ustawy z dnia 28 lipca 2005 r. o kosztach sądowych w sprawach cywilnych"},{"n":74,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, z ważnych powodów sąd może zezwolić, żeby oświadczenie o wstąpieniu w związek małżeński zostało złożone przez pełnomocnika; takie pełnomocnictwo powinno wymieniać osobę, z kt órą małżeństwo ma być zawarte i być udzielone:","options":["w formie dokumentowej,","na piśmie z podpisem urzędowo poświadczonym,","w formie aktu notarialnego,"],"year":2023,"source_question":"2023/74","answer":"B","basis":"art. 6 § 2 k.r. i o."},{"n":75,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, n ie mogą zawrzeć ze sobą małżeństwa:","options":["krewni w linii prostej i bocznej, rodzeństwo ani powinowaci w linii prostej, a sąd nie może zezwolić na zawarcie małżeństwa między tymi osobami w żadnej sytuacji,","krewni w linii prostej, rodzeństwo ani powinowaci w linii prostej; jednakże z ważnych powodów sąd może zezwolić na zawarcie małżeństwa między powinowatymi,","krewni w linii prostej, rodzeństwo a ni powinowaci w linii prostej i bocznej; sąd nie może zezwolić na zawarcie małżeństwa między tymi osobami w żadnej sytuacji. 22 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"],"year":2023,"source_question":"2023/75","answer":"B","basis":"art. 14 § 1 k.r. i o."},{"n":76,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, jeżeli nie zawarto umowy majątkowej małżeńskiej, z chwilą zawarcia małżeństwa powstaje między małżonkami z mocy ustawy wspólność majątkowa (wspólność ustawowa) obejmująca przedmioty majątkowe nabyte w czasie jej trwania przez oboje małżonków lub przez jednego z nich (majątek wspólny); do majątku wspólnego należą między innymi:","options":["prawa autorskie i prawa pokrewne, prawa własności przemysłowej oraz inne prawa twórcy,","przedmioty majątkowe uzyskane z tytułu nagrody za osobiste osiągnięcia jednego z małżonków,","środki zgromadzone na rachunku otwartego lub pracowniczego funduszu emerytalnego każdego z małżonków."],"year":2023,"source_question":"2023/76","answer":"C","basis":"art. 31 § 2 pkt 3 k.r. i o."},{"n":77,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, umowa majątkowa małżeńska:","options":["może być zmieniona,","nie może być zmieniona,","może być zmieniona tylko za zgodą prokuratora regionalnego właściwego dla miejsca zamieszkania małżonków."],"year":2023,"source_question":"2023/77","answer":"A","basis":"art. 47 § 2 k.r. i o."},{"n":78,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, w przypadku rozdzielności majątkowej z wyrównaniem dorobków, gdy umowa majątkowa małżeńska została zawarta w czasie trwania małżeństwa, dorobkiem każdego z małżonków jest:","options":["stan jego majątku osobistego w chwili zawarcia małżeństwa,","stan jego majątku osobistego w chwili zawarcia umowy majątkowej,","wzrost wartości jego majątku osobistego po zawarciu umowy majątkowej."],"year":2023,"source_question":"2023/78","answer":"C","basis":"art. 513 § 1 w zw. z art. 33 k.r. i o."},{"n":79,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, krewnymi w linii bocznej są osoby:","options":["z których jedna pochodzi od drugiej,","które pochodzą od wspólnego przodka, a nie są krewnymi w linii prostej,","które są krewnymi drugiego małżonka. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 23"],"year":2023,"source_question":"2023/79","answer":"B","basis":"art. 617 § 1 zdanie drugie k.r. i o."},{"n":80,"q":"Zgodnie z Kodeksem rodzinnym i opiekuńczym, uznanie ojcostwa:","options":["nie może nastąpić po osiągnięciu przez dzi ecko pełnoletności , a jeżeli dziecko zmarło przed osiągnięciem pełnoletności , uznanie ojcostwa może nastąpić w ciągu roku od dnia, w którym mężczyzna składający oświadczenie o uznaniu dowiedział się o śmierci dziecka, nie później jednak niż do dnia, w którym dziecko osiągnęłoby pełnoletność,","nie może nastąpić po osiągnięciu przez dziecko wieku trzech lat, a jeżeli dziecko zmarło przed osiągnięciem tego wieku , uznanie ojcostwa może nastąpić w ciągu trzech miesięcy od dnia, w którym mężczyzna składający oświa dczenie o uznaniu dowiedział się o śmierci dziecka, nie później jednak niż do dnia, w którym dziecko osiągnęłoby ten wiek,","może nastąpić w każdym czasie , również po osiągnięciu przez dziecko pełnoletności."],"year":2023,"source_question":"2023/80","answer":"A","basis":"art. 76 k.r. i o."},{"n":81,"q":"Zgodnie z ustawą o zastawie rejestrowym i rejestrze zastawów, zastawem rejestrowym można obciążyć między innymi:","options":["każde zbywalne prawo majątkowe,","przedsiębiorstwo wraz z wchodzącym w jego skład prawem użytkowania wieczystego nieruchomości,","zbiór rzeczy ruchomych lub praw, stanowiący całość gospodarczą, choćby jego skład był zmienny."],"year":2023,"source_question":"2023/81","answer":"C","basis":"art. 7 ust. 2 pkt 3 ustawy z dnia 6 grudnia 1996 r. o zastawie rejestrowym i rejestrze zastawów"},{"n":82,"q":"Zgodnie z ustawą o Krajowym Rejestrze Sądowym, o ile przepis szczególny nie stanowi inaczej, wniosek o wpis do Krajowego Rejestru Sądowego powinien być złożony nie później niż w terminie:","options":["7 dni od dnia zdarzenia uzasadniającego dokonanie wpisu,","14 dni od dnia zdarzenia uzasadniającego dokonanie wpisu,","30 dni od dnia zdarzenia uzasadniającego dokonanie wpisu. 24 EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH"],"year":2023,"source_question":"2023/82","answer":"A","basis":"art. 22 ustawy z dnia 20 sierpnia 1997 r. o Krajowym Rejestrze Sądowym"},{"n":83,"q":"Zgodnie z ustawą o Krajowym Rejestrze Sądowym, o ile przepis szczególny ni e stanowi inaczej, podmiot wpisany do Krajowego Rejestru Sądowego (Rejestr) jest obowiązany umieszczać w oświadczeniach pisemnych, skierowanych, w zakresie swojej działalności, do oznaczonych osób (z wyjątkiem osób pozostających ze spółką wpisaną do Rejest ru w stałych stosunkach umownych) i organów , między innymi następujące dane:","options":["imiona i nazwiska osób uprawnionych do reprezentacji tego podmiotu i sposób jego reprezentacji,","numer REGON nadany temu podmiotowi,","oznaczenie sądu rejestrowego, w którym przechowywane są akta rejestrowe tego podmiotu oraz numer tego podmiotu w Rejestrze."],"year":2023,"source_question":"2023/83","answer":"C","basis":"art. 34 ust. 1 pkt 5 ustawy z dnia 20 sierpnia 1997 r. o Krajowym Rejestrze Sądowym"},{"n":84,"q":"Zgodnie z ustawą – Prawo restrukturyzacyjne, wniosek o otwarcie postępowania sanacyjnego w stosunku do niewypłacalnej osoby prawnej może zgłosić arczeniem dalszych części rzeczy sprzedanych oraz od umowy odstąpić bez wyznaczania kupującemu terminu do zabezpieczenia zapłaty."],"year":2025,"source_question":"2025/44","answer":"A","basis":"art. 552 k.c."},{"n":45,"q":"Zgodnie z Kodeksem cywilnym, umowa o dzieło, którego wykonanie zależy od osobistych przymiotów przyjmującego zamówienie, rozwiązuje się:","options":["wskutek śmierci zamawiającego,","jedynie wskutek śmierci przyjmującego zamówienie,","wskutek śmierci przyjmującego zamówienie lub jego niezdolności do pracy."],"year":2025,"source_question":"2025/45","answer":"C","basis":"art. 645 § 1 k.c. 3"},{"n":46,"q":"Zgodnie z Kodeksem cywilnym, przez umowę komisu przyjmujący zlecenie (komisant) zobowiązuje się za wynagrodzeniem (prowizja) w zakresie działalności swego przedsiębiorstwa do kupna lub sprzedaży rzeczy ruchomych:","options":["na swój rachunek, lecz w imieniu dającego zlecenie (komitenta),","na rachunek dającego zlecenie (komitenta), lecz w imieniu własnym,","na rachunek i w imieniu dającego zlecenie (komitenta)."],"year":2025,"source_question":"2025/46","answer":"B","basis":"art. 765 k.c."},{"n":47,"q":"Zgodnie z Kodeksem cywilnym, uznania spadkobiercy za niegodnego może żądać każdy, kto ma w tym interes; z żądaniem takim może wystąpić:","options":["w ciągu roku od dnia, w którym dowiedział się o przyczynie niegodności, nie później jednak niż przed upływem lat trzech od otwarcia spadku,","w ciągu dwóch lat od dnia, w którym dowiedział się o przyczynie niegodności , nie później jednak niż przed upływem lat pięciu od otwarcia spadku,","w ciągu trzech lat od dnia, w którym dowied ział się o przyczynie niegodności , nie później jednak niż przed upływem lat pięciu od otwarcia spadku. EGZAMIN WSTĘPNY DLA KANDYDATÓW NA APLIKANTÓW ADWOKACKICH I RADCOWSKICH 13"],"year":2025,"source_question":"2025/47","answer":"A","basis":"art. 929 k.c."},{"n":48,"q":"Zgodnie z Kodeksem cywilnym, spadkodawca może przez rozrządzenie testamentowe zobowiązać do spełnienia okre 2025/56","answer":"B","basis":"art. 84 ustawy z dnia 6 lipca 1982 r. o księgach wieczystych i hipotece"},{"n":57,"q":"Zgodnie z ustawą o ubezpieczeniach obowiązkowych, Ubezpieczeniowym Funduszu Gwarancyjnym i Polskim Biurze Ubezpieczycieli Komunikacyjnych, zakład ubezpieczeń posiadający zezwolenie na wykonywanie działalności ubezpieczeniowej w grupach obejmujących ubezpieczenia obowiązkowe:","options":["nie może odmówić zawarcia umowy ubezpieczenia obowiązkowego , jeżeli w ramach prowadzonej działalności ubezpieczeniowej zawiera takie umowy ubezpieczenia,","może odmówić zawarcia umowy ubezpieczenia obowiązkowego , nawet jeżeli w ramach prowadzonej działalności ubezpieczeniowej zawiera takie umowy ubezpieczenia,","nie może odmówić zawarcia umowy ubezpieczenia obowiązkowego, niezależnie od tego, czy w ramach prowadzonej działalności ubezpieczeniowej zawiera takie umowy ubezpieczenia."],"year":2025,"source_question":"2025/57","answer":"A","basis":"art. 5 ust. 2 ustawy z dnia 22 maja 2003 r. o ubezpieczeniach obowiązkowych, Ubezpieczeniowym Fun duszu Gwarancyjnym i Polskim Biurze Ubezpieczycieli Komunikacyjnych"},{"n":58,"q":"Zgodnie z ustawą – Prawo wekslowe, protest sporządza:","options":["trasat,","poręczyciel wekslowy,","notariusz."],"year":2025,"source_question":"2025/58","answer":"C","basis":"art. 85 ustawy z dnia 28 kwietnia 1936 r. – Prawo wekslowe"},{"n":59,"q":"Zgodnie z ustawą o fundacjach, oświadczenie woli o ustanowieniu fundacji:","options":["powinno być zawsze złożone w formie aktu notarialnego,","powinno być złożone w formie aktu notarialnego, nawet jeżeli ustanowienie fundacji następuje w testamencie,","powinno być złożone w formie aktu notarialnego; zachowania tej formy nie wymaga się, jeżeli ustanowienie fundacji następuje w testamencie."],"year":2025,"source_question":"2025/59","answer":"C","basis":"art. 3 ust. 1 ustawy z dnia 6 kwietnia 1984 r. o fundacjach"},{"n":60,"q":"Zgodnie z ustawą – Prawo o stowarzyszeniach, stowarzyszenie opiera działalność {answered}`}function nextQ(){idx++;if(idx>=pool.length)finish();else render()}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h2>Koniec testu</h2><p><b>Wynik: ${score}</b> / ${pool.filter(q=>q.answer).length} zweryfikowanych pytań</p><p>Błędy: ${wrong.length}</p><div class="grid"><button id="startBtn">Jeszcze raz</button><button class="secondary" id="wrongBtn">Powtórz błędy</button></div>`}function quit(){$('quiz').classList.add('hidden');$('setup').classList.remove('hidden')}function restartCurrent(){pool=shuffle(pool);idx=0;score=0;answered=0;wrong=[];render()}function showWrong(){let saved=JSON.parse(localStorage.getItem('wrongQuestions')||'[]');let list=wrong.length?wrong:saved;$('setup').classList.add('hidden');$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('wrong').classList.remove('hidden');$('wrong').innerHTML='<h2>Moje błędy</h2>'+(list.length?'<p>Ostatnie błędne pytania: '+list.length+'</p><button data-action="repeatWrong">Rozwiąż błędy ponownie</button><ol>'+list.map(x=>`<li><b>${x.year}/${x.n}</b> – ${x.q}</li>`).join('')+'</ol>':'<p>Brak zapisanych błędów w tej sesji.</p>')+'<br><button class="secondary" data-action="reload">Wróć</button>'}function repeatWrong(){pool=shuffle((wrong.length?wrong:JSON.parse(localStorage.getItem('wrongQuestions')||'[]')).slice());idx=0;score=0;answered=0;wrong=[];$('wrong').classList.add('hidden');$('quiz').classList.remove('hidden');render()}window.addEventListener('beforeunload',()=>{if(wrong.length)localStorage.setItem('wrongQuestions',JSON.stringify(wrong))});<script>
