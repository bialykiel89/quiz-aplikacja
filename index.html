<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Egzamin na aplikację – pełny bank</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
<header>
<h1>Egzamin na aplikację adwokacką i radcowską</h1>
<div class="muted">Pełny bank pytań z dostępnych zestawów • tryb nauki i egzaminu • telefon / komputer</div>
</header>

<div id="loading" class="panel">
<h2>Ładowanie bazy pytań…</h2>
<p class="muted">Chwileczkę.</p>
</div>

<div id="setup" class="panel hidden">
<h2>Wybierz tryb</h2>
<div class="grid">
<select id="year">
<option value="all">Wszystkie dostępne lata</option>
<option value="2016">2016</option>
<option value="2017">2017</option>
<option value="2019">2019</option>
<option value="2021">2021</option>
<option value="2022">2022</option>
<option value="2023">2023</option>
<option value="2024">2024</option>
<option value="2025">2025</option>
</select>
<select id="count">
<option value="20">Losowe 20</option>
<option value="50">Losowe 50</option>
<option value="100">Losowe 100</option>
<option value="all">Cały wybrany bank</option>
</select>
</div>
<p class="muted">Pytania bez zweryfikowanego klucza są oznaczone i nie są wliczane do wyniku.</p>
<div class="grid">
<button type="button" id="startBtn">Rozpocznij</button>
<button type="button" class="secondary" id="wrongBtn">Moje błędy</button>
</div>
</div>

<div id="quiz" class="hidden">
<div class="panel">
<div class="stats">
<div class="stat" id="score">Wynik: 0</div>
<div class="stat" id="pos">1 / 1</div>
<div class="stat" id="answered">Odpowiedzi: 0</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="panel">
<div class="qmeta" id="meta"></div>
<div class="question" id="q"></div>
<div id="opts"></div>
<div id="feedback" class="hidden"></div>
<button type="button" id="next" class="hidden">Następne pytanie</button>
</div>

<div class="grid">
<button type="button" class="secondary" id="quitBtn">Zakończ</button>
<button type="button" class="secondary" id="restartBtn">Losuj ponownie</button>
</div>
</div>

<div id="result" class="hidden panel"></div>
<div id="wrong" class="hidden panel"></div>
</div>

<script src="./app.js" defer></script>
</body>
</html>
